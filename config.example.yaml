# Kasa configuration
# Location: ~/.kasa/config.yaml

kubernetes:
  # Path to kubeconfig file (empty = default ~/.kube/config)
  kubeconfig: ""
  # Kubernetes context to use (empty = current context from kubeconfig)
  # The context name is also used as a subfolder for manifest storage,
  # so each cluster's manifests are kept separate.
  context: ""

agent:
  # Model to use (required). Examples:
  #   anthropic/claude-sonnet-4    - Claude Sonnet via OpenRouter
  #   google/gemini-2.5-flash      - Gemini Flash via OpenRouter
  #   openai/gpt-4.1               - GPT-4.1 via OpenRouter
  model: ""
  # Agent name (default: kasa)
  name: kasa
  # Maximum tool calls per turn before the agent is stopped (default: 25, 0 = unlimited)
  max_tool_calls: 25
  # Warn the model after this many calls to the same tool in one turn (default: 3, 0 = disabled)
  tool_warn_threshold: 3

deployments:
  # Directory where manifests are stored (supports ~ for home directory)
  # Default: ~/.kasa/deployments
  directory: ""
  # Git remote URL for team sync (e.g., git@github.com:org/manifests.git)
  # remote: ""

# API credentials
# Environment variables take precedence over config values.
# Checked in order: OPENROUTER_API_KEY env, GOOGLE_API_KEY env, api_key config, google_api_key config.
credentials:
  # API key for the LLM provider (or set OPENROUTER_API_KEY env var)
  api_key: ""
  # Base URL for the OpenAI-compatible API endpoint.
  # Default: https://openrouter.ai/api/v1
  # Examples for other providers:
  #   https://api.openai.com/v1            - OpenAI
  #   https://api.groq.com/openai/v1       - Groq
  #   https://generativelanguage.googleapis.com/v1beta/openai  - Google Gemini (OpenAI-compat)
  #   http://localhost:11434/v1            - Ollama (local)
  #   http://localhost:8080/v1             - llama.cpp / LocalAI
  base_url: "https://openrouter.ai/api/v1"
  # Legacy: Google API key (still works, api_key is preferred)
  # google_api_key: ""
  # Optional: Jina API key for web search and URL fetching (or set JINA_API_KEY env var)
  jina_api_key: ""

# Prompts for tuning (leave empty for built-in defaults)
# prompts:
#   system: |
#     Your custom system prompt here...
